name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install platformio==6.1.19 clang-format==18.1.8

      - name: Run host-side tests and level validation
        run: sh tests/run-host-tests.sh

      - name: Check C++ formatting
        run: clang-format --dry-run --Werror MostlyLogic/MostlyLogic.ino MostlyLogic/*.cpp MostlyLogic/*.h tests/*.cpp tests/include/*.h

      - name: Verify package version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              Path("packaging/arduboy-package.json").read_text(encoding="utf-8")
          )
          expected_tag = f"v{metadata['version']}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Tag {actual_tag!r} does not match package version "
                  f"{metadata['version']!r}; expected {expected_tag!r}."
              )
          PY

      - name: Verify release artifacts
        run: python scripts/build-release.py --check

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/MostlyLogic.hex \
            dist/MostlyLogic.arduboy \
            --verify-tag \
            --generate-notes \
            --title "Mostly Logic ${{ github.ref_name }}"
